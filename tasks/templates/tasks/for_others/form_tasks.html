{% load crispy_forms_tags %}

{% block content %}

  <form class="p-3" hx-post="{% url 'tasks:create_tasks_others' %}" hx-target='#tasks_for_others_table' hx-swap="beforeend" hx-disabled-elt= "find button[id='save'], find button[id='close']">
    {% csrf_token %}
    {{form|crispy}}
    <div>
      <button type="submit" id="save" class="btn bg-gradient-success me-2">Salvar</button>
      <button type="button" id="close" class="btn bg-gradient-danger" data-bs-dismiss="modal">Cancelar</button>
    </div>
  </form>

  <script>

    document.body.addEventListener("htmx:afterSettle", function (event) {
    const modal = bootstrap.Modal.getInstance(document.getElementById("exampleModal"));
    if (modal) {
      modal.hide();
    }
  });
   
  </script>
{% endblock %}
