<tr id="task-row-{{ task.id }}">
  <td>
    <div class="d-flex px-2 py-1">
      <div class="d-flex flex-column justify-content-center">
        <h6 class="mb-0 text-sm">{{ task.title }}</h6>
      </div>
    </div>
  </td>

  <td class="align-middle text-center text-sm">
    <h6 class="text-sm mb-0">{{ task.category.name }}</h6>
  </td>

  <td class="align-middle text-center">
    <h6 class="text-sm mb-0">{{ task.due_date|date:"d M Y" }}</h6>
  </td>

  <td style="display: flex; justify-content: space-evenly;">
    <button type="button" class="btn bg-gradient-info btn-sm mb-0 me-1 px-3 align-items-center">
      Ver
    </button>
    <button type="button" class="btn bg-gradient-success btn-sm mb-0 me-1 px-3">
      Concluir
    </button>
    <button type="button" class="btn bg-gradient-danger btn-sm mb-0 px-3"
            hx-get="{% url 'tasks:delete_tasks' task.id %}"  
            hx-target=".modal-task-delet-body" 
            hx-swap="innerHTML"
            data-bs-toggle="modal" data-bs-target="#taskDeletModal">
      Excluir
    </button>
  </td>
</tr>

<div class="modal fade" id="taskDeletModal" tabindex="-1" role="dialog" aria-labelledby="categoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-task-delet-body">
        ...
      </div>
    </div>
  </div>
</div>
