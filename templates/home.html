{% extends 'base.html' %}

{% block title %}Home - Task Manager{% endblock %}
{% block content %}

    <h3>Minhas Organizações</h3>
    
    {% for org in orgs %}
    <div class="container">
        <div class="row">
          <div class="col-sm" style="border: solid 1px #3333;">
            <a href="{% url 'details_org' org.organization.id %}" >
                <p>{{ org.organization.name_org }}</p>
                <p>{{ org.role }}</p>
            </a>
          </div>
        </div>
    </div>
    {% empty %}
    <p>Você não está associado a nenhuma organização.</p>
    {% endfor %}




    <p></p>
    <!-- tirar     -->
    <a href="{% url 'creat_user' %}">CREAT USER</a>


{% endblock %}
