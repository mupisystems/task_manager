{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gerenciamento de Tarefas{% endblock %}</title>
    <!-- Link para o CSS do tema -->
    <link rel="stylesheet" href="{% static 'soft-ui/css/soft-ui-dashboard.css' %}">
    <!--     Fonts and icons     -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
    <!-- Nucleo Icons -->
    <link href="../../../assets/css/nucleo-icons.css" rel="stylesheet" />
    <link href="../../../assets/css/nucleo-svg.css" rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link href="../../../assets/css/nucleo-svg.css" rel="stylesheet" />
    <!-- CSS Files -->
    <link id="pagestyle" href="../../../assets/css/soft-ui-dashboard.css?v=1.1.1" rel="stylesheet" />
    <!-- Nepcha Analytics (nepcha.com) -->
    <!-- Nepcha is a easy-to-use web analytics. No cookies and fully compliant with GDPR, CCPA and PECR. -->
    <script defer data-site="YOUR_DOMAIN_HERE" src="https://api.nepcha.com/js/nepcha-analytics.js"></script>
    <!-- Outros arquivos CSS podem ser adicionados aqui -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Conteúdo principal -->
    {% block content %}
    <!-- Aqui serão inseridos os conteúdos das páginas -->
    {% endblock %}

    <!-- Scripts do tema -->
    <script src="{% static 'soft-ui/js/soft-ui-dashboard.js' %}"></script>
    <!-- Outros scripts podem ser adicionados aqui -->
    {% block extra_js %}{% endblock %}
</body>
</html>
