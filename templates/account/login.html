{% extends "account/account_base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
  <main class="main-content mt-0">
    <section>
      <div class="page-header min-vh-75">
        <div class="container">
          <div class="row">
            <div class="col-xl-4 col-lg-5 col-md-6 d-flex flex-column mx-auto">
              <div class="card card-plain mt-8">
                <div class="card-header pb-0 text-left bg-transparent">
                  <h3 class="font-weight-bolder text-info text-gradient">Bem vindo novamente</h3>
                  <p class="mb-0">Por favor, entre com suas credenciais</p>
                </div>
                <div class="card-body text-left">
                  <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="text-center pt-0">
                      <button type="submit" class="btn bg-gradient-info w-100 mt-4 mb-0">Entrar</button>
                    </div>
                  </form>

                </div>

                <div class="card-footer text-center pt-0 px-lg-2 px-1">
                  <p class="mb-4 text-sm mx-auto">
                    Na primeira vez, por favor,
                    <a href="{% url 'account_signup' %}" class="text-info text-gradient font-weight-bold">Cadastrar</a>
                  </p>
                </div>

              </div>
            </div>
            <div class="col-md-6">
              <div class="oblique position-absolute top-0 h-100 d-md-block d-none me-n8">
                <div class="oblique-image bg-cover position-absolute fixed-top ms-auto h-100 z-index-0 ms-n6" style="background-image:url('../../static/soft-ui/img/curved-images/curved6.jpg')"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <!-- -------- START FOOTER 3 w/ COMPANY DESCRIPTION WITH LINKS & SOCIAL ICONS & COPYRIGHT ------- -->
  <footer class="footer mt-4 py-5">
    <div class="container">
      <div class="row">
        <div class="col-8 mx-auto text-center mt-1">
          <p class="mb-0 text-secondary">
            Copyright &copy; <script>
              document.write(new Date().getFullYear())
            </script> MupiSystems.
          </p>
        </div>
      </div>
    </div>
  </footer>
{% endblock %}
