<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Logout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-1" >
        <div class="row justify-content-center">
            <div class="col-md-6" style="width: 100%;">
                <div class="card" >
                    <div class="card-header text-center" style="padding-bottom: 0%;">
                        <h4>Confirmar Logout</h4>
                    </div>
                    <div class="card-body" style="padding-top: 0%;">
                        <p class="text-center" 
                            style="
                                margin-top: 1rem; 
                                margin-bottom: 1.7rem;
                            ">
                            Você tem certeza que deseja sair?
                        </p>
                        <form method="post" action="{% url 'account_logout' %}" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                            {% csrf_token %}
                            {% if redirect_field_value %}
                                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                            {% endif %}
                            <div class="d-grid " style="width: 40%;">
                                <button type="submit" class="btn btn-danger">Sair</button>
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
